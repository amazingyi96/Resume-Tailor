# ResumeTailor — Next.js 16 behind Nginx
# yi-zheng-iris.com — purchased via Namecheap, DNS managed wherever nameservers point

upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS redirect (main domain + jobtracker subdomain)
server {
    listen 80;
    server_name yi-zheng-iris.com www.yi-zheng-iris.com jobtracker.yi-zheng-iris.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (main domain)
server {
    listen 443 ssl http2;
    server_name yi-zheng-iris.com www.yi-zheng-iris.com;

    # SSL — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/yi-zheng-iris.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yi-zheng-iris.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options             "SAMEORIGIN" always;
    add_header X-Content-Type-Options      "nosniff"    always;
    add_header X-XSS-Protection            "1; mode=block" always;
    add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains; preload" always;

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── Static portfolio page ──
    location /portfolio/ {
        alias /opt/resumetailor/deploy/;
        index index.html;
        try_files $uri $uri/ /portfolio/index.html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Next.js static assets (hashed, immutable) ──
    location /_next/static/ {
        alias /opt/resumetailor/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Public assets ──
    location /public/ {
        alias /opt/resumetailor/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── Everything else → Next.js ──
    location / {
        proxy_pass            http://nextjs_upstream;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade             $http_upgrade;
        proxy_set_header      Connection          'upgrade';
        proxy_set_header      Host                $host;
        proxy_set_header      X-Real-IP           $remote_addr;
        proxy_set_header      X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto   $scheme;
        proxy_set_header      X-Forwarded-Host    $host;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_buffering       off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# HTTPS (jobtracker subdomain → redirect to main /tracker)
server {
    listen 443 ssl http2;
    server_name jobtracker.yi-zheng-iris.com;

    ssl_certificate     /etc/letsencrypt/live/yi-zheng-iris.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yi-zheng-iris.com/privkey.pem;

    return 301 https://yi-zheng-iris.com/tracker;
}
